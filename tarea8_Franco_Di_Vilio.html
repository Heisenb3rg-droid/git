/*Consigna 1: Hay que representar una pequeña biblioteca de películas. Cada peli tiene su título, año, lista de actores principales, duración y lista de géneros. Usen los temas nuevos aprendidos hasta ahora en este ejercicio. Cuando crean una película tiene que tener una función que se exporte a sí misma como string en consola mostrando su información.Cada película además tiene propiedad de clasificación de edad.						
Y además también vamos a tener una biblioteca (tiene que ser instanciable como las películas) que tendrá la lista de películas. Debe permitir agregar películas, reproducir películas (se busca la peli solicitada y la reproduce, o avisa si no encuentra) y listar las películas por género elegido. Deben tener al menos 5 películas agregadas a la biblioteca en código de forma global.*/

/*Consigna 2: Ahora tienen que armar una promesa con 50% de posibilidades de éxito y 50% de falla al devolver la lista completa de películas de la biblioteca, con resolve y reject. Si funciona la posibilidad, se devuelve con éxito, y si no, falla y tira mensaje de error. Modificar y usar text.search() para buscar películas existentes al reproducirse.                                                                                                                                                                                                                                                                                                                 
Y por último, agregarle dos funcionalidades más a la biblioteca de películas:
Que pueda desactivar temporalmente una película y no reproducirla, dando ERROR siempre. Si pasa esto que muestre dos veces el mismo emoji en la consola o alerta.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
En este caso que al agregar y crear películas, automáticamente se le asigne que está disponible siempre sin agregar ningún parámetro de más.*/

class Pelicula {
    constructor(movieTitle, releaseYear, actors, movieLength, genres, rating)
    {
        this.movieTitle = movieTitle;
        this.releaseYear = releaseYear;
        this.actors = actors;
        this.movieLength = movieLength;
        this.genres = genres;
        this.rating = rating;
}};
